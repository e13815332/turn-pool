<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TURN 中继池</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--card2:#1a2235;--b:#1e293b;--t:#e2e8f0;--t2:#94a3b8;--t3:#64748b;--a:#60a5fa;--g:#34d399;--y:#fbbf24;--r:#f87171;--rds:10px;--rds2:6px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font:14px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.c{max-width:960px;margin:0 auto;padding:0 16px}
h1{font-size:22px;font-weight:700;padding:20px 0 6px;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--t3);margin-bottom:16px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--b);border-radius:var(--rds2);padding:10px 14px;text-align:center;min-width:80px;flex:1}
.st .v{font-size:18px;font-weight:700;color:var(--a)}
.st .l{font-size:11px;color:var(--t3);margin-top:2px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bar input,.bar select{background:var(--card);border:1px solid var(--b);color:var(--t);padding:7px 12px;border-radius:var(--rds2);font-size:13px;outline:0}
.bar input:focus,.bar select:focus{border-color:var(--a)}
.bar input{flex:1;min-width:160px}
.bar select{min-width:90px}
.btns{display:flex;gap:4px}
.btn{background:var(--card);border:1px solid var(--b);color:var(--t2);padding:7px 14px;border-radius:var(--rds2);font-size:13px;cursor:pointer}
.btn.on{background:var(--a);color:#fff;border-color:var(--a)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 12px;color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--b);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(30,41,59,.5);white-space:nowrap}
.tbl tr:hover td{background:rgba(30,41,59,.3)}
.tbl .ip{font-family:'SF Mono','Fira Code',monospace;color:var(--a);font-size:12px}
.tbl .c{font-size:12px}
.tbl .sw{font-size:11px;color:var(--t2);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tbl .ok{color:var(--g);font-size:11px}
.tbl .auth{color:var(--y);font-size:11px}
.tbl .cp{cursor:pointer}
.ipw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:20px}
.crd{background:var(--card);border:1px solid var(--b);border-radius:var(--rds);padding:14px 16px;cursor:pointer;transition:.15s}
.crd:hover{border-color:var(--a)}
.crd .addr{font-family:'SF Mono','Fira Code',monospace;font-size:15px;color:var(--a);font-weight:600;margin-bottom:8px}
.crd .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--t2)}
.tag{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600}
.tag-all{background:rgba(96,165,250,.15);color:var(--a)}
.tag-tcp{background:rgba(52,211,153,.15);color:var(--g)}
.tag-udp{background:rgba(251,191,36,.15);color:var(--y)}
.emo{text-align:center;padding:40px;color:var(--t3)}
.emo .ic{font-size:40px;margin-bottom:8px}
.ft{text-align:center;padding:20px;color:var(--t3);font-size:12px}
@media(max-width:600px){
  .stats{gap:6px}.st{padding:8px 10px}.st .v{font-size:16px}
  .bar input{min-width:120px}.bar select{min-width:70px}
  .cards{grid-template-columns:1fr}
  .tbl .sw{max-width:100px}.tbl .tag{display:none}
}
</style>
</head>
<body>
<div class="c">
<h1>TURN 中继池</h1>
<div class="sub">GitHub · 自动更新</div>

<div class="stats" id="stats">
  <div class="st"><div class="v" id="s0">-</div><div class="l">总节点</div></div>
  <div class="st"><div class="v" id="s1">-</div><div class="l">ALL</div></div>
  <div class="st"><div class="v" id="s2">-</div><div class="l">TCP</div></div>
  <div class="st"><div class="v" id="s3">-</div><div class="l">UDP</div></div>
</div>

<div class="bar">
  <input id="q" type="text" placeholder="搜索 IP、端口、国家...">
  <select id="pf"><option value="">全部</option><option value="ALL">ALL</option><option value="TCP">TCP</option><option value="UDP">UDP</option></select>
  <select id="af"><option value="">全部认证</option><option value="none">无认证</option><option value="cred">需认证</option></select>
  <select id="cf"><option value="">全部国家</option></select>
  <div class="btns">
    <button class="btn on" data-v="table" id="bt">表格</button>
    <button class="btn" data-v="card" id="bc">卡片</button>
  </div>
</div>

<div id="vT">
  <div class="ipw"><table class="tbl"><thead><tr><th>IP:端口</th><th>类型</th><th>国家</th><th>认证</th><th>软件</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<div id="vC" style="display:none" class="cards"></div>

<div class="ft">更新 <span id="upd">-</span> · <span id="fc">-</span></div>
</div>

<script>
var A=[],F=[],q,pf,af,cf,tb,cv,bt,bc;
function $(id){return document.getElementById(id)}
function E(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e}

function flag(c){
  var f={CN:'🇨🇳',US:'🇺🇸',DE:'🇩🇪',HK:'🇭🇰',JP:'🇯🇵',SG:'🇸🇬',TW:'🇹🇼',KR:'🇰🇷',GB:'🇬🇧',FR:'🇫🇷',NL:'🇳🇱',SE:'🇸🇪',AU:'🇦🇺',CA:'🇨🇦',IN:'🇮🇳',BR:'🇧🇷',RU:'🇷🇺',IT:'🇮🇹',ES:'🇪🇸',CH:'🇨🇭',PL:'🇵🇱',AT:'🇦🇹',BE:'🇧🇪',DK:'🇩🇰',FI:'🇫🇮',NO:'🇳🇴',CZ:'🇨🇿',IE:'🇮🇪',TR:'🇹🇷',NZ:'🇳🇿',ZA:'🇿🇦',AE:'🇦🇪',MY:'🇲🇾',TH:'🇹🇭',VN:'🇻🇳',PH:'🇵🇭',ID:'🇮🇩',IL:'🇮🇱',RO:'🇷🇴',HU:'🇭🇺',BG:'🇧🇬',GR:'🇬🇷',PT:'🇵🇹',SK:'🇸🇰',LT:'🇱🇹',LV:'🇱🇻',EE:'🇪🇪',LU:'🇱🇺',MT:'🇲🇹',CY:'🇨🇾',IS:'🇮🇸',AR:'🇦🇷',CL:'🇨🇱',CO:'🇨🇴',MX:'🇲🇽',PE:'🇵🇪'};
  return f[c]||''
}

function parseCountry(item){
  // item is [mode, ip, port, auth, sw, country]
  return item[5] || ''
}

async function init(){
  try{
    var r=await fetch('/api/data'),d=await r.json();
    A=d.rows||[];$('upd').textContent=(d.updated||'').slice(0,19)||'-';
    var cs=new Set(A.map(function(x){return x[5]}).filter(Boolean));
    var sorted=Array.from(cs).sort();
    var h='<option value="">全部国家</option>';
    sorted.forEach(function(c){h+='<option value="'+c+'">'+flag(c)+' '+c+'</option>'});
    $('cf').innerHTML=h;
  }catch(e){
    $('tb').innerHTML='<tr><td colspan="5"><div class="emo"><div class="ic">⚠️</div><p>加载失败</p></div></td></tr>';
    return
  }
  q=$('q');pf=$('pf');af=$('af');cf=$('cf');tb=$('tb');cv=$('vC');
  bt=$('bt');bc=$('bc');
  q.oninput=render;pf.onchange=render;af.onchange=render;cf.onchange=render;
  bt.onclick=function(){switchView('table')};
  bc.onclick=function(){switchView('card')};
  render();
}

function render(){
  var kw=(q.value||'').toLowerCase(),pv=pf.value,av=af.value,cv2=cf.value;
  F=A.filter(function(r){
    if(pv&&r[0]!==pv)return false;
    if(av==='none'&&r[3]&&r[3]!=='无认证'&&r[3]!=='-')return false;
    if(av==='cred'&&(!r[3]||r[3]==='无认证'||r[3]==='-'))return false;
    if(cv2&&r[5]!==cv2)return false;
    if(kw){var s=(r[1]+' '+r[2]+' '+r[5]).toLowerCase();if(!s.includes(kw))return false}
    return true
  });
  var t=A.length;
  $('s0').textContent=t;
  $('s1').textContent=A.filter(function(r){return r[0]==='ALL'}).length;
  $('s2').textContent=A.filter(function(r){return r[0]==='TCP'}).length;
  $('s3').textContent=A.filter(function(r){return r[0]==='UDP'}).length;
  $('fc').textContent=F.length+'/'+t;
  tRender();cRender();
}

function tRender(){
  var h='';
  F.forEach(function(r){
    var mode=r[0],ip=r[1],port=r[2],auth=r[3],sw=r[4],c=r[5];
    var hasAuth=auth&&auth!=='无认证'&&auth!=='-';
    var fullAddr=hasAuth?auth+'@'+ip+':'+port:ip+':'+port;
    var mt=mode==='ALL'?'<span class="tag tag-all">ALL</span>':mode==='TCP'?'<span class="tag tag-tcp">TCP</span>':'<span class="tag tag-udp">UDP</span>';
    var ab=hasAuth?'<span class="auth">🔑 '+auth+'</span>':'<span class="ok">✓ 无</span>';
    var ss=sw&&sw!=='-'?'<span class="sw">'+sw+'</span>':'<span class="sw" style="color:var(--t3)">—</span>';
    h+='<tr class="cp" data-addr="'+fullAddr+'"><td class="ip">'+ip+':'+port+'</td><td>'+mt+'</td><td class="c">'+flag(c)+' '+c+'</td><td>'+ab+'</td><td>'+ss+'</td></tr>';
  });
  tb.innerHTML=h||'<tr><td colspan="5"><div class="emo"><div class="ic">🔍</div><p>无结果</p></div></td></tr>';
  document.querySelectorAll('.cp').forEach(function(el){el.onclick=function(){cp(this.dataset.addr,this)}});
}

function cRender(){
  var h='';
  F.forEach(function(r){
    var mode=r[0],ip=r[1],port=r[2],auth=r[3],sw=r[4],c=r[5];
    var hasAuth=auth&&auth!=='无认证'&&auth!=='-';
    var fullAddr=hasAuth?auth+'@'+ip+':'+port:ip+':'+port;
    var mt=mode==='ALL'?'<span class="tag tag-all">ALL</span>':mode==='TCP'?'<span class="tag tag-tcp">TCP</span>':'<span class="tag tag-udp">UDP</span>';
    var ab=hasAuth?'<span class="auth">🔑 '+auth+'</span>':'<span class="ok">✓ 无认证</span>';
    var ss=sw&&sw!=='-'?'<span class="sw">'+sw+'</span>':'<span style="color:var(--t3)">—</span>';
    h+='<div class="crd" data-addr="'+fullAddr+'"><div class="addr">'+ip+':'+port+'</div><div class="meta">'+mt+' '+flag(c)+' '+c+' · '+ab+' · '+ss+'</div></div>';
  });
  cv.innerHTML=h||'<div class="emo"><div class="ic">🔍</div><p>无结果</p></div>';
  document.querySelectorAll('.crd').forEach(function(el){el.onclick=function(){cp(this.dataset.addr,this)}});
}

function switchView(v){
  $('vT').style.display=v==='card'?'none':'';
  $('vC').style.display=v==='card'?'grid':'none';
  bt.className=v==='table'?'btn on':'btn';
  bc.className=v==='card'?'btn on':'btn';
}

function cp(text,el){
  var done=function(){el.style.background='rgba(52,211,153,.15)';setTimeout(function(){el.style.background=''},1000)};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){});
  }else{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    done();
  }
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
